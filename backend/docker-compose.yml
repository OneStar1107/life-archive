# ══════════════════════════════════════════════════════════════
# 人生档案 · 冰川记忆 —— 本地数据库与缓存
# ══════════════════════════════════════════════════════════════
# 用法：
#   cp .env.example .env        # 填入真实值
#   cp .env.docker.example .env # docker-compose 读取的变量
#   docker compose up -d
#   docker compose ps           # 期望 healthcheck 转 healthy
# ══════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifearchive-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 中文排序与大小写不敏感
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - lifearchive-net

  redis:
    image: redis:7-alpine
    container_name: lifearchive-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    # 仅用于令牌黑名单与限流计数，不做持久化
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lifearchive-net

volumes:
  pgdata:
    driver: local

networks:
  lifearchive-net:
    driver: bridge
